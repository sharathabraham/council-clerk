name: Update council data

on:
  schedule:
    # 11:00 UTC = 6/7am Eastern, once a day
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run minutes/votes scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/update_data.py

      - name: Run budgets scraper
        run: python scraper/update_budgets.py

      - name: Run public notices scraper
        run: python scraper/update_notices.py

      - name: Commit updated data (if any)
        run: |
          git config user.name "council-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update council data"
            git push
          fi
